name: Build TintNeon.asi
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Get plugin-sdk
        shell: pwsh
        run: git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git C:\plugin-sdk

      - uses: microsoft/setup-msbuild@v2

      - name: Generate plugin-sdk solution with premake
        shell: pwsh
        run: |
          Set-Location C:\plugin-sdk\tools\premake
          Get-Content premake5.lua -TotalCount 80 | Out-File $env:GITHUB_WORKSPACE\premake_lua_head.log
          .\premake5.exe --help 2>&1 | Out-File $env:GITHUB_WORKSPACE\premake_help.log
          .\premake5.exe vs2022 2>&1 | Tee-Object -FilePath $env:GITHUB_WORKSPACE\premake_run.log
          Get-ChildItem C:\plugin-sdk -Recurse -Include *.sln,*.vcxproj | ForEach-Object { $_.FullName } | Tee-Object -FilePath $env:GITHUB_WORKSPACE\layout.log
        continue-on-error: true

      - name: Build plugin_sa library (Release, Win32)
        shell: pwsh
        run: |
          $projs = Get-ChildItem C:\plugin-sdk -Recurse -Filter *.vcxproj
          $proj = $projs | Where-Object { $_.Name -match '^plugin_sa\.vcxproj$' } | Select-Object -First 1
          if (-not $proj) { $proj = $projs | Where-Object { $_.Name -match 'plugin_sa' -and $_.Name -notmatch 'unreal' } | Select-Object -First 1 }
          if (-not $proj) { Write-Host "NO plugin_sa PROJECT FOUND"; exit 0 }
          Write-Host "Building $($proj.FullName)"
          msbuild $proj.FullName /p:Configuration=Release /p:Platform=Win32 /m 2>&1 | Tee-Object -FilePath $env:GITHUB_WORKSPACE\sdk_build.log
        continue-on-error: true

      - name: Locate plugin library
        shell: pwsh
        run: |
          Get-ChildItem C:\plugin-sdk -Recurse -Include *.lib | Where-Object { $_.FullName -notmatch '\\shared\\' } | ForEach-Object { $_.FullName } | Tee-Object -FilePath libs.log

      - name: Compile TintNeon.asi
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          set SDK=C:\plugin-sdk
          set PLIB=
          for /f "delims=" %%i in ('dir /s /b %SDK%\plugin*.lib 2^>nul ^| findstr /v /i "unreal plugin_vc plugin_III plugin_IV plugin_II"') do set PLIB=%%i
          echo Using library: [%PLIB%] > compile.log
          cl /nologo /std:c++20 /Zc:__cplusplus /EHsc /O2 /MT /LD /Fe:TintNeon.asi TintNeon.cpp ^
            /DGTASA /DPLUGIN_SGV_10US /D_CRT_SECURE_NO_WARNINGS /D_USE_MATH_DEFINES /DNOMINMAX ^
            /I%SDK%\plugin_sa /I%SDK%\plugin_sa\game_sa /I%SDK%\shared /I%SDK%\shared\game /I%SDK% ^
            /I%SDK%\safetyhook /I%SDK%\injector /I%SDK%\hooking /I%SDK%\modutils ^
            /link /MACHINE:X86 /LIBPATH:%SDK%\shared\rwd3d9 /LIBPATH:%SDK%\shared\dxsdk "%PLIB%" user32.lib >> compile.log 2>&1
          type compile.log

      - name: Upload result and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TintNeon
          path: |
            TintNeon.asi
            TintNeon.ini
            *.log
