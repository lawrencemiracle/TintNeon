name: Build TintNeon.asi
on:
  workflow_dispatch:      # lets you press "Run workflow" manually
  push:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Get plugin-sdk
        shell: pwsh
        run: git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git C:\plugin-sdk

      - name: Install DirectX SDK headers
        shell: pwsh
        run: choco install directx-sdk -y --no-progress
        continue-on-error: true

      - uses: microsoft/setup-msbuild@v2

      - name: Show plugin-sdk layout (for debugging)
        shell: pwsh
        run: |
          Get-ChildItem C:\plugin-sdk -Depth 1 | Select-Object FullName
          Get-ChildItem C:\plugin-sdk -Recurse -Filter *.vcxproj | Select-Object FullName

      - name: Build plugin-sdk library (Win32, GTA SA)
        shell: pwsh
        run: |
          $proj = Get-ChildItem C:\plugin-sdk -Recurse -Filter "plugin_sa.vcxproj" | Select-Object -First 1
          msbuild $proj.FullName /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /m 2>&1 | Tee-Object -FilePath sdk_build.log
        env:
          PLUGIN_SDK_DIR: C:\plugin-sdk
        continue-on-error: true

      - name: Locate plugin library
        shell: pwsh
        run: Get-ChildItem C:\plugin-sdk -Recurse -Include *.lib | Select-Object FullName

      - name: Compile TintNeon.asi
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          set SDK=C:\plugin-sdk
          for /f "delims=" %%i in ('dir /s /b %SDK%\plugin.lib 2^>nul') do set PLIB=%%i
          if not defined PLIB for /f "delims=" %%i in ('dir /s /b %SDK%\*plugin*sa*.lib 2^>nul') do set PLIB=%%i
          echo Using library: %PLIB%
          cl /nologo /std:c++17 /EHsc /O2 /MT /LD /Fe:TintNeon.asi TintNeon.cpp ^
            /DGTASA /DPLUGIN_SGV_10US /D_CRT_SECURE_NO_WARNINGS /D_USE_MATH_DEFINES /DNOMINMAX ^
            /I%SDK%\plugin_sa /I%SDK%\plugin_sa\game_sa /I%SDK%\shared /I%SDK%\shared\game ^
            /I"C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)\Include" ^
            /link /MACHINE:X86 "%PLIB%" user32.lib 2>&1 > compile.log
          type compile.log

      - name: Upload result and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TintNeon
          path: |
            TintNeon.asi
            TintNeon.ini
            *.log
